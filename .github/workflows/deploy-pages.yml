# Builds phuonglam.com from the repository and publishes it to GitHub Pages.
# The site only changes when the build and all tests pass; otherwise the previous
# version stays live.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build static pages
        run: node tools/build_static_site.js

      - name: Run tests
        run: node --test tools/*.test.js

      - name: Collect public files
        run: node tools/prepare_pages_artifact.js _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
