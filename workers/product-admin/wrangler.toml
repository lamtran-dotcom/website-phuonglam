# Deploy: cd workers/product-admin && npx wrangler deploy
# Secrets (set once each): npx wrangler secret put ADMIN_PASSWORD | GITHUB_TOKEN
# Details: docs/SETUP.md "Admin v2 (online)".
name = "phuonglam-admin"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
GITHUB_REPO = "lamtran-dotcom/website-phuonglam"
GITHUB_BRANCH = "main"
SITE_URL = "https://phuonglam.com"
# ADMIN_PASSWORD and GITHUB_TOKEN are secrets (npx wrangler secret put <NAME>),
# never written into this repo.

# At most 5 login attempts per IP per minute.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "41001"

  [ratelimits.simple]
  limit = 5
  period = 60

# At most 3 login attempts per minute from everyone combined (the password is a short PIN).
[[ratelimits]]
name = "LOGIN_GLOBAL_LIMITER"
namespace_id = "41002"

  [ratelimits.simple]
  limit = 3
  period = 60
