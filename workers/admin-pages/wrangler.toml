# Fast front door for the product admin: https://phuonglam-admin.pages.dev
# The owner's ISP throttles uploads to Cloudflare's 104.x/172.67.x ranges (workers.dev),
# while *.pages.dev (172.66.x) is fast. This project only forwards every request to the
# phuonglam-admin Worker, which keeps the password, GitHub token and login rate limits.
# Deploy: cd workers/admin-pages && npx wrangler pages deploy
name = "phuonglam-admin"
pages_build_output_dir = "./public"
compatibility_date = "2026-10-01"

[[services]]
binding = "ADMIN"
service = "phuonglam-admin"
