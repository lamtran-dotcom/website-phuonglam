          <h2>Thông tin cơ bản</h2>
          <p class="editor-hint">Tên và danh mục giúp khách nhận diện sản phẩm. URL hiện tại được giữ nguyên khi đổi tên.</p>
          <label>Hình ảnh sản phẩm <span class="muted">· ${(product.images || []).filter(Boolean).length}/9</span></label>
          <p class="editor-hint">Bấm hoặc kéo thả để tải ảnh. Ảnh đầu tiên là ảnh bìa.</p>
          <div class="images product-images">${Array.from({ length: 9 }).map((_, index) => imageBox(product, index)).join('')}</div>
          <div class="row">
            <div><label>Tên sản phẩm *</label><input value="${esc(product.name)}" oninput="updateField('name', this.value)" /></div>
            <div><label>Danh mục *</label><select onchange="updateField('categoryId', this.value)">${CATEGORIES.map(([value, label]) => `<option value="${value}" ${product.categoryId === value ? 'selected' : ''}>${label}</option>`).join('')}</select></div>
          </div>
          <div class="row3">
            <div><label>SKU</label><input value="${esc(product.sku)}" oninput="updateField('sku', this.value)" /></div>
            <div><label>Nhãn</label><select onchange="updateField('tag', this.value)">${PRODUCT_TAGS.map(tag => `<option value="${esc(tag)}" ${(product.tag || '') === tag ? 'selected' : ''}>${tag || 'Không gắn nhãn'}</option>`).join('')}</select></div>
            <div><label>Trạng thái</label><select onchange="updateField('hidden', this.value)"><option value="" ${!isHidden(product) ? 'selected' : ''}>Đang hiển thị trên website</option><option value="true" ${isHidden(product) ? 'selected' : ''}>Ẩn khỏi danh sách</option></select></div>
          </div>
        </section>

        <section class="product-edit-section" role="tabpanel" ${productEditorSection !== 'content' ? 'hidden' : ''}>
          <h2>Mô tả sản phẩm</h2>
          <p class="editor-hint">Chia đoạn bằng một dòng trống. Ghi rõ dữ kiện đã xác nhận; không tự thêm cam kết, công dụng hoặc thông số.</p>
          <label>Mô tả ngắn</label>
          <textarea oninput="updateField('shortDesc', this.value)">${esc(product.shortDesc)}</textarea>
          <label>Mô tả chi tiết</label>
          <textarea style="min-height:360px" oninput="updateField('description', this.value)">${esc(product.description)}</textarea>
          <label>Cách dùng và lưu ý</label>
          <textarea style="min-height:180px" oninput="updateField('usage', this.value)">${esc(product.usage)}</textarea>
        </section>

        <section class="product-edit-section" role="tabpanel" ${productEditorSection !== 'variants' ? 'hidden' : ''}>
          <h2>Thông tin bán hàng</h2>
          <p class="editor-hint">Thiết lập giá chung, sau đó thêm phân loại nếu sản phẩm có nhiều lựa chọn.</p>
          <div class="row">
            <div><label>Giá bán chung (₫) *</label><input ${numberInputAttrs} value="${esc(product.price)}" oninput="updateField('price', this.value)" /></div>
            <div><label>Giá gốc chung (₫)</label><input ${numberInputAttrs} value="${esc(product.originalPrice ?? '')}" oninput="updateField('originalPrice', this.value)" /></div>
          </div>
          <h3>Phân loại hàng</h3>
          ${(product.optionGroups || []).map((group, index) => optionGroupHtml(group, index)).join('')}
          <button class="secondary" style="margin-top:14px;border-style:dashed" onclick="addOptionGroup()">+ Thêm nhóm phân loại</button>
          <p class="editor-hint">Ví dụ: Màu sắc, Quy cách. Điền các tùy chọn rồi bấm “Tạo tổ hợp còn thiếu”; giá và ảnh đã nhập được giữ nguyên.</p>
          ${variantEditorHtml(product)}
          <p class="editor-hint">Kho hàng: website hiện chưa quản lý số lượng tồn theo phân loại. Có thể dùng nhãn “Hết hàng” ở Thông tin cơ bản.</p>
        </section>
        <section class="product-edit-section" role="tabpanel" ${productEditorSection !== 'shipping' ? 'hidden' : ''}>
          <h2>Vận chuyển</h2>
          <label>Khối lượng chung sau đóng gói (gram)</label>
          <input style="max-width:320px" ${numberInputAttrs} value="${esc(product.weight ?? '')}" oninput="updateField('weight', this.value)" />
          <p class="editor-hint">Khối lượng riêng của từng phân loại được nhập trong bảng Thông tin bán hàng. Để trống để dùng khối lượng chung.</p>
          <button class="secondary" onclick="setProductEditorSection('variants')">Đi đến bảng phân loại</button>
        </section>

        <section class="product-edit-section" role="tabpanel" ${productEditorSection !== 'seo' ? 'hidden' : ''}>
          <h2>Hiển thị trên Google</h2>
          <p class="editor-hint">Để trống để trang tự dùng tên và mô tả sản phẩm. URL sản phẩm không đổi khi chỉnh tiêu đề.</p>
          <label>Tiêu đề SEO <span class="muted">(khuyến nghị tối đa 60 ký tự)</span></label>
          <input id="seoTitleInput" value="${esc(product.seoTitle || '')}" oninput="updateField('seoTitle', this.value); updateSeoPreview()" placeholder="${esc(product.name || '')} | Phương Lâm" />
          <label>Mô tả SEO <span class="muted">(khuyến nghị 120–160 ký tự)</span></label>
          <textarea id="seoDescriptionInput" style="min-height:100px" oninput="updateField('seoDescription', this.value); updateSeoPreview()" placeholder="Tóm tắt sản phẩm rõ ràng, đúng thông tin đã xác nhận.">${esc(product.seoDescription || '')}</textarea>
          <div class="seo-preview-card" aria-live="polite">
            <div class="seo-preview-url">phuonglam.com/san-pham/${esc(product.slug || 'duong-dan-san-pham')}/</div>
            <div id="seoPreviewTitle" class="seo-preview-title">${esc(product.seoTitle || `${product.name || 'Sản phẩm'} | Phương Lâm`)}</div>
            <div id="seoPreviewDescription" class="seo-preview-description">${esc(product.seoDescription || product.shortDesc || '')}</div>
          </div>
        </section>

        <div class="editor-save-dock">
          <span>${productDraftDirty ? 'Có chỉnh sửa chưa lưu' : 'Đã lưu vào trình duyệt'}</span>
          <button type="button" class="secondary" onclick="previewCurrentProduct()">Xem bản đã lưu</button>
          <button type="button" onclick="saveAll()" ${saving || !apiOnline || pendingUploads ? 'disabled' : ''}>Lưu thay đổi</button>
        </div>
      `;
    }

    function setProductEditorSection(section) {
      productEditorSection = section;
      renderKeepScroll();
    }

    function updateSeoPreview() {
      const product = selectedProduct();
      if (!product) return;
      const title = document.getElementById('seoPreviewTitle');
      const description = document.getElementById('seoPreviewDescription');
      if (title) title.textContent = product.seoTitle || `${product.name || 'Sản phẩm'} | Phương Lâm`;
      if (description) description.textContent = product.seoDescription || product.shortDesc || '';
    }

    function previewCurrentProduct() {
      const product = selectedProduct();
      if (!product?.slug) { alert('Sản phẩm chưa có URL. Hãy lưu trước để tạo URL rồi xem.'); return; }
      window.open(`/san-pham/${encodeURIComponent(product.slug)}/?preview=${Date.now()}`, '_blank', 'noopener');
    }

    function imageBox(product, index) {
      const src = product.images[index] || '';
      return `
        <div class="image-box" onclick="pickProductImage(${index})" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="dropProductImage(event, ${index})">
          ${src ? `<img src="${esc(src)}" />${index === 0 ? '<span class="cover-label">Ảnh bìa</span>' : ''} <button class="remove-img" onclick="event.stopPropagation(); removeProductImage(${index})">Xoá</button>` : `<span>+<br>Ảnh ${index + 1}</span>`}
        </div>
      `;
    }

    function optionGroupHtml(group, index) {
      return `
        <div class="variant sales-group">
          <div class="option-group-grid">
            <div><label>Nhóm phân loại ${index + 1}</label><input value="${esc(group.name || '')}" oninput="updateOptionGroup(${index}, 'name', this.value)" placeholder="Màu" /></div>
            <div>
              <label>Tùy chọn</label>
              <div class="option-value-list">
                ${(group.values || []).map((value, valueIndex) => optionValueHtml(index, value, valueIndex)).join('')}
                <button class="option-value-add" onclick="addOptionValue(${index})" title="Thêm giá trị">+</button>
              </div>
            </div>
            <div><label>&nbsp;</label><button class="danger small" onclick="removeOptionGroup(${index})">Xoá nhóm</button></div>
          </div>
        </div>
      `;
    }

    function optionValueHtml(groupIndex, value, valueIndex) {
      return `
        <div class="option-value-pill">
          <input value="${esc(value || '')}" oninput="updateOptionValue(${groupIndex}, ${valueIndex}, this.value)" onchange="renderKeepScroll()" placeholder="Phân loại" />
          <button class="option-value-remove" onclick="removeOptionValue(${groupIndex}, ${valueIndex})" title="Xoá giá trị">×</button>
        </div>
      `;
    }

    function optionInputHtml(group, variant, index) {
      const values = Array.isArray(group.values) ? group.values : [];
      const current = variant.options?.[group.name] || '';
      return `
        <div>
          <label>${esc(group.name)}</label>
          <select onchange="updateVariantOption(${index}, ${jsAttr(group.name)}, this.value)">
            <option value="">Chọn ${esc(group.name)}</option>
            ${values.map(value => `<option value="${esc(value)}" ${current === value ? 'selected' : ''}>${esc(value)}</option>`).join('')}
          </select>
        </div>
      `;
    }

    function getColorGroup(product) {
      return (product.optionGroups || []).find(group => group.name && Array.isArray(group.values) && group.values.length && isColorOptionGroup(group));
    }

    function getQuantityGroup(product) {
      return (product.optionGroups || []).find(group => group.name && Array.isArray(group.values) && group.values.length && !isColorOptionGroup(group));
    }

    function findVariantIndex(product, colorGroup, colorValue, quantityGroup, quantityValue) {
      return (product.variants || []).findIndex(variant =>
        variant.options?.[colorGroup.name] === colorValue &&
        variant.options?.[quantityGroup.name] === quantityValue
      );
    }

    function variantEditorHtml(product) {
      const variants = product.variants || [];
      const groups = (product.optionGroups || []).filter(group => group.name && group.values?.length);
      return `
        <div class="sales-toolbar"><h3>Danh sách phân loại hàng <span class="muted">(${variants.length})</span></h3>
          ${groups.length ? '<button class="secondary small" onclick="generateMissingVariants()">Tạo tổ hợp còn thiếu</button>' : ''}
          <button class="secondary small" onclick="addVariant()">+ Thêm phân loại</button>
        </div>
        ${variants.length ? `
          <div class="bulk-prices">
            <div><label for="bulkPrice">Giá bán (₫)</label><input id="bulkPrice" ${numberInputAttrs} placeholder="Nhập giá bán" /></div>
            <div><label for="bulkOriginalPrice">Giá gốc (₫)</label><input id="bulkOriginalPrice" ${numberInputAttrs} placeholder="Nhập giá gốc" /></div>
            <div><label for="bulkWeight">Khối lượng (gram)</label><input id="bulkWeight" ${numberInputAttrs} placeholder="Nhập khối lượng" /></div>
            <button onclick="applyVariantBulk()">Áp dụng tất cả</button>
          </div>
          <p class="editor-hint">Chỉ áp dụng các ô đã điền. Giá bán là giá khách trả; giá gốc là giá trước giảm.</p>
          <div class="sales-table-wrap" tabindex="0" aria-label="Bảng phân loại, cuộn ngang để xem đủ cột"><table class="sales-table">
            <thead><tr><th scope="col">Phân loại / Hình ảnh</th><th scope="col">Giá bán (₫) *</th><th scope="col">Giá gốc (₫)</th><th scope="col">SKU phân loại</th><th scope="col">Gram</th><th scope="col">Xóa</th></tr></thead>
            <tbody>${variants.map((variant, index) => `<tr>
              <td><div class="variant-identity">${variantImageBox(variant, index)}<div>
                <input aria-label="Tên phân loại ${index + 1}" value="${esc(variant.name)}" placeholder="Tên phân loại" oninput="updateVariant(${index}, 'name', this.value)" />
                ${groups.map(group => optionInputHtml(group, variant, index)).join('')}
              </div></div></td>
              ${['price', 'originalPrice', 'sku', 'weight'].map((field, column) => `<td><input aria-label="${['Giá bán', 'Giá gốc', 'SKU', 'Khối lượng'][column]} phân loại ${index + 1}" ${field !== 'sku' ? numberInputAttrs : ''} value="${esc(variant[field] ?? '')}" oninput="updateVariant(${index}, '${field}', this.value)" /></td>`).join('')}
              <td><button class="danger small" aria-label="Xóa phân loại ${index + 1}" onclick="removeVariant(${index})">×</button></td>
            </tr>`).join('')}</tbody>
          </table></div>` : '<div class="sales-empty"><strong>Chưa có phân loại</strong><p class="editor-hint">Sản phẩm dùng giá chung. Thêm phân loại để thiết lập giá và ảnh riêng cho từng lựa chọn.</p></div>'}
      `;
    }

    function applyVariantBulk() {
      const fields = { price: 'bulkPrice', originalPrice: 'bulkOriginalPrice', weight: 'bulkWeight' };
      const values = {};
      for (const [field, inputId] of Object.entries(fields)) {
        const raw = document.getElementById(inputId).value.trim();
        if (!raw) continue;
        const value = parseNumberInput(raw);
        if (value === null || value < 0) { alert('Hãy nhập giá và khối lượng là số không âm.'); return; }
        values[field] = raw;
      }
      if (!Object.keys(values).length) { alert('Điền ít nhất một giá trị để áp dụng.'); return; }
      (selectedProduct()?.variants || []).forEach((variant, index) => {
        Object.entries(values).forEach(([field, value]) => updateVariant(index, field, value));
      });
      renderKeepScroll();
    }

    function generateMissingVariants() {
      const product = selectedProduct();
      const groups = product?.optionGroups || [];
      if (!groups.length || groups.some(group => !group.name.trim() || !group.values?.length || group.values.some(value => !value.trim()))) {
        alert('Điền tên nhóm và tất cả tùy chọn trước khi tạo phân loại.'); return;
      }
      if (new Set(groups.map(group => group.name.trim())).size !== groups.length || groups.some(group => new Set(group.values.map(value => value.trim())).size !== group.values.length)) {
        alert('Tên nhóm và các tùy chọn trong cùng nhóm không được trùng nhau.'); return;
      }
      const count = groups.reduce((total, group) => total * group.values.length, 1);
      if (count > 200) { alert('Tối đa 200 tổ hợp mỗi lần. Hãy giảm số tùy chọn.'); return; }
      const combinations = groups.reduce((rows, group) => rows.flatMap(row => group.values.map(value => ({ ...row, [group.name]: value }))), [{}]);
      updateSelected(current => {
        current.variants = current.variants || [];
        combinations.forEach(options => {
          if (current.variants.some(variant => groups.every(group => variant.options?.[group.name] === options[group.name]))) return;
          current.variants.push({ id: id(), name: Object.values(options).join(' / '), sku: '', price: current.price || 0, originalPrice: current.originalPrice ?? null, weight: current.weight ?? null, image: '', options });
        });
      }, true);
    }

    function colorPickerButton(color) {
      const active = variantEditorColor === color;
      const swatch = colorSwatch(color);
      return `
        <button class="secondary" onclick="setVariantEditorColor(${jsAttr(color)})" style="display:flex;align-items:center;gap:8px;border-color:${active ? '#318223' : '#dbe8d7'};background:${active ? '#f0f8ef' : '#fff'}">
          <span style="width:20px;height:20px;border-radius:50%;display:inline-block;background:${swatch.background};border:1.5px solid ${swatch.border}"></span>
          <strong>${esc(color)}</strong>
        </button>
      `;
    }

    function groupedVariantRow(product, colorGroup, colorValue, quantityGroup, quantityValue) {
      const index = findVariantIndex(product, colorGroup, colorValue, quantityGroup, quantityValue);
      const variant = index >= 0 ? product.variants[index] : null;
      if (!variant) {
        return `
          <div class="variant">
            <div class="actions" style="justify-content:space-between">
              <strong>${esc(quantityValue)}</strong>
              <button class="secondary small" onclick="addVariantForOptions(${jsAttr(colorGroup.name)}, ${jsAttr(colorValue)}, ${jsAttr(quantityGroup.name)}, ${jsAttr(quantityValue)})">+ Tạo phân loại</button>
            </div>
          </div>
        `;
      }
      return `
        <div class="variant">
          <div class="variant-grid">
            <div>
              <label>Ảnh ${esc(quantityValue)}</label>
              ${variantImageBox(variant, index)}
            </div>
            <div><label>Số lượng</label><input value="${esc(quantityValue)}" readonly /></div>
            <div><label>Tên phân loại *</label><input value="${esc(variant.name)}" oninput="updateVariant(${index}, 'name', this.value)" /></div>
            <div><label>Giá bán *</label><input ${numberInputAttrs} value="${esc(variant.price)}" oninput="updateVariant(${index}, 'price', this.value)" /></div>
            <div><label>Giá gốc</label><input ${numberInputAttrs} value="${esc(variant.originalPrice ?? '')}" oninput="updateVariant(${index}, 'originalPrice', this.value)" /></div>
            <div><label>Gram</label><input ${numberInputAttrs} value="${esc(variant.weight ?? '')}" oninput="updateVariant(${index}, 'weight', this.value)" /></div>
            <div><label>SKU</label><input value="${esc(variant.sku)}" oninput="updateVariant(${index}, 'sku', this.value)" /></div>
          </div>
        </div>
      `;
    }

    function variantHtml(product, variant, index) {
      const optionGroups = Array.isArray(product.optionGroups) ? product.optionGroups.filter(group => group.name && Array.isArray(group.values) && group.values.length) : [];
      const optionText = variant.options && Object.keys(variant.options).length
        ? Object.entries(variant.options).map(([key, value]) => `${key}: ${value}`).join(' · ')
        : '';
      return `
        <div class="variant">
          ${optionText ? `<div class="muted" style="font-size:12px;margin-bottom:8px">Tuỳ chọn: ${esc(optionText)}</div>` : ''}
          <div class="variant-grid">
            <div>
              <label>Ảnh phân loại</label>
              ${variantImageBox(variant, index)}
            </div>
            <div><label>Tên phân loại *</label><input value="${esc(variant.name)}" oninput="updateVariant(${index}, 'name', this.value)" /></div>
            <div><label>Giá bán *</label><input ${numberInputAttrs} value="${esc(variant.price)}" oninput="updateVariant(${index}, 'price', this.value)" /></div>
            <div><label>Giá gốc</label><input ${numberInputAttrs} value="${esc(variant.originalPrice ?? '')}" oninput="updateVariant(${index}, 'originalPrice', this.value)" /></div>
            <div><label>Gram</label><input ${numberInputAttrs} value="${esc(variant.weight ?? '')}" oninput="updateVariant(${index}, 'weight', this.value)" /></div>
            <div><label>SKU</label><input value="${esc(variant.sku)}" oninput="updateVariant(${index}, 'sku', this.value)" /></div>
            <div><label>&nbsp;</label><button class="danger small" onclick="removeVariant(${index})">Xoá</button></div>
          </div>
          ${optionGroups.length ? `<div class="row3" style="margin-top:10px">${optionGroups.map(group => optionInputHtml(group, variant, index)).join('')}</div>` : ''}
        </div>
      `;
    }

    function variantImageBox(variant, index) {
      return `
        <div class="variant-img" onclick="pickVariantImage(${index})" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="dropVariantImage(event, ${index})">
          ${variant.image
            ? `<img src="${esc(variant.image)}" /><button class="remove-img" onclick="event.stopPropagation(); removeVariantImage(${index})">Xoá</button>`
            : '<span class="hint">+<br>Kéo thả ảnh</span>'}
        </div>
      `;
    }

    function selectProduct(productId) {
      selectedId = productId;
      variantEditorColor = '';
      productEditorSection = 'details';
      render();
    }

    function updateSelected(mutator, shouldRender = false) {
      const product = selectedProduct();
      if (!product) return;
      mutator(product);
      scheduleProductDraftSave();
      if (shouldRender) renderKeepScroll();
    }

    function updateProductById(productId, mutator, shouldRender = false) {
      const product = products.find(item => String(item.id) === String(productId));
      if (!product) return false;
      mutator(product);
      scheduleProductDraftSave();
      if (shouldRender) renderKeepScroll();
      return true;
    }

    function updateVariantById(productId, variantId, mutator, shouldRender = false) {
      return updateProductById(productId, product => {
        const variant = product.variants?.find(item => String(item.id) === String(variantId));
        if (variant) mutator(product, variant);
      }, shouldRender);
    }

    function updateField(field, value) {
      updateSelected(product => {
        if (field === 'hidden') {
          product.hidden = value === 'true';
        } else if (['price', 'originalPrice', 'weight'].includes(field)) {
          const parsed = parseNumberInput(value);
          const key = `product:${product.id}:${field}`;
          if (String(value).trim() && parsed === null) numericInputErrors.set(key, `${product.name || 'Sản phẩm'}: ${field === 'price' ? 'giá bán' : field === 'originalPrice' ? 'giá gốc' : 'khối lượng'} không phải số hợp lệ.`);
          else numericInputErrors.delete(key);
          product[field] = field === 'price' ? (parsed || 0) : parsed;
        } else {
          product[field] = value;
        }
      });
      renderProductList();
    }

    function addProduct() {
      const product = normalizeProduct({
        id: id(),
        sku: 'PL-' + String(Date.now()).slice(-4),
        categoryId: listCategory || 'nen-thom',
        name: 'Sản phẩm mới',
        price: 0,
        hidden: true,
        images: [],
        variants: []
      });
      products.unshift(product);
      selectedId = product.id;
      scheduleProductDraftSave();
      render();
    }

    function duplicateProduct() {
      const product = selectedProduct();
      if (!product) return;
      // The URL is generated from the name on first save and then kept, so ask for the
      // final name now instead of saving "… - bản sao" into the permanent URL.
      const name = prompt('Tên cho sản phẩm mới (đường dẫn URL sẽ tạo từ tên này và giữ cố định):', product.name);
      if (name === null) return;
      if (!name.trim() || name.trim().toLocaleLowerCase('vi') === String(product.name || '').trim().toLocaleLowerCase('vi')) {
        alert('Hãy đặt tên khác với sản phẩm gốc để tránh trùng trang trên Google.');
        return;
      }
      const copy = normalizeProduct(JSON.parse(JSON.stringify(product)));
      copy.id = id();
      copy.name = name.trim();
      copy.slug = '';
      copy.sku = '';
      copy.hidden = true;
      copy.variants = copy.variants.map(variant => ({ ...variant, id: id(), sku: '' }));
      products.unshift(copy);
      selectedId = copy.id;
      scheduleProductDraftSave();
      render();
    }

    function deleteProduct() {
      const product = selectedProduct();

      products = products.filter(item => String(item.id) !== String(product.id));
      for (const key of numericInputErrors.keys()) {
        if (key.startsWith(`product:${product.id}:`) || key.startsWith(`variant:${product.id}:`)) numericInputErrors.delete(key);
      }
      selectedId = products[0]?.id || null;
      scheduleProductDraftSave();
      render();
    }

    function updateOptionGroup(index, field, value) {
      updateSelected(product => {
        product.optionGroups = product.optionGroups || [];
        const group = product.optionGroups[index];
        if (!group) return;
        const oldName = group.name;
        if (field === 'values') {
          group.values = value.split(',').map(item => item.trim()).filter(Boolean);
          return;
        }
        group.name = value;
        if (oldName && oldName !== value) {
          (product.variants || []).forEach(variant => {
            if (!variant.options || !(oldName in variant.options)) return;
            variant.options[value] = variant.options[oldName];
            delete variant.options[oldName];
          });
          if (product.optionImages?.[oldName]) {
            product.optionImages[value] = product.optionImages[oldName];
            delete product.optionImages[oldName];
          }
        }
      });
    }

    function addOptionValue(groupIndex) {
      updateSelected(product => {
        product.optionGroups = product.optionGroups || [];
        const group = product.optionGroups[groupIndex];
        if (!group) return;
        group.values = Array.isArray(group.values) ? group.values : [];
        group.values.push('');
      }, true);
    }

    function updateOptionValue(groupIndex, valueIndex, value) {
      updateSelected(product => {
        product.optionGroups = product.optionGroups || [];
        const group = product.optionGroups[groupIndex];
        if (!group) return;
        group.values = Array.isArray(group.values) ? group.values : [];
        const oldValue = group.values[valueIndex] || '';
        group.values[valueIndex] = value;
        if (!oldValue || oldValue === value || !group.name) return;

        (product.variants || []).forEach(variant => {
          if (variant.options?.[group.name] === oldValue) variant.options[group.name] = value;
        });
        const images = product.optionImages?.[group.name];
        if (images?.[oldValue]) {
          images[value] = images[oldValue];
          delete images[oldValue];
        }
        if (variantEditorColor === oldValue) variantEditorColor = value;
      });
    }

    function removeOptionValue(groupIndex, valueIndex) {
      const product = selectedProduct();
      const group = product?.optionGroups?.[groupIndex];
      const removedValue = group?.values?.[valueIndex];
      const assignedVariants = (product?.variants || []).filter(variant => variant.options?.[group?.name] === removedValue);
      if (assignedVariants.length) {
        alert(`Có ${assignedVariants.length} phân loại đang dùng “${removedValue}”. Hãy đổi giá trị của các phân loại đó trước khi xóa.`);
        return;
      }
      updateSelected(product => {
        const group = product.optionGroups?.[groupIndex];
        if (!group || !Array.isArray(group.values)) return;
        const [removedValue] = group.values.splice(valueIndex, 1);
        if (removedValue && product.optionImages?.[group.name]) delete product.optionImages[group.name][removedValue];
        if (variantEditorColor === removedValue) variantEditorColor = group.values[0] || '';
      }, true);
    }

    function canvasToBlob(canvas, type, quality) {
      return new Promise(resolve => canvas.toBlob(resolve, type, quality));
    }

    async function optimizeImageFile(file) {
      if (!file || !file.type?.startsWith('image/')) return file;
      const imageUrl = URL.createObjectURL(file);
      try {
        const image = new Image();
        image.src = imageUrl;
        await image.decode();

        const maxSize = 1600;
        const ratio = Math.min(1, maxSize / Math.max(image.width, image.height));
        const width = Math.max(1, Math.round(image.width * ratio));
        const height = Math.max(1, Math.round(image.height * ratio));
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d', { alpha: false });
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(image, 0, 0, width, height);

        const webpBlob = await canvasToBlob(canvas, 'image/webp', 0.82);
        if (!webpBlob) return file;
        const baseName = file.name.replace(/\.[^.]+$/, '') || 'product-image';
        return new File([webpBlob], `${baseName}.webp`, { type: 'image/webp' });
      } finally {
        URL.revokeObjectURL(imageUrl);
      }
    }

    async function uploadFile(file) {
      if (!apiOnline) throw new Error('Chế độ mở file tĩnh không upload ảnh trực tiếp được. Hãy chạy node tools/local_admin_server.js rồi mở admin qua http://127.0.0.1:8000/admin-upload.html.');
      if (!file) return '';
      pendingUploads += 1;
      updateDraftStatus();
      render();
      try {
        const optimizedFile = await optimizeImageFile(file);
        const form = new FormData();
        form.append('image', optimizedFile);
        const res = await fetch(API_UPLOAD, { method: 'POST', body: form });
        const data = await readJsonResponse(res, 'API upload ảnh');
        if (!data.ok) throw new Error(data.message || 'Upload ảnh thất bại.');
        return data.url;
      } finally {
        pendingUploads = Math.max(0, pendingUploads - 1);
        render();
        updateDraftStatus();
      }
    }

          callback(url);
        } catch (error) {

      input.click();

    function cleanFeaturedIds(ids) {
      const seen = new Set();
      return ids.map(id => String(id || '')).filter(id => {
        if (!id || seen.has(id)) return false;
        seen.add(id);
        return true;
      });

    function setFeaturedSlot(index, productId) {
      const id = String(productId || '');
      const ids = [...(settings.featuredIds || [])].map(String);
      const existingIndex = id ? ids.findIndex(item => item === id) : -1;
      const currentId = ids[index] || '';
      if (id && existingIndex !== -1 && existingIndex !== index) {
        ids[existingIndex] = currentId;
        ids[index] = id;
      } else if (id) ids[index] = id;
      else ids.splice(index, 1);
      settings.featuredIds = cleanFeaturedIds(ids);
      render();
    }

      const ids = [...(settings.featuredIds || [])];
      const nextIndex = index + direction;
      if (nextIndex < 0 || nextIndex >= ids.length) return;
      [ids[index], ids[nextIndex]] = [ids[nextIndex], ids[index]];
      settings.featuredIds = cleanFeaturedIds(ids);
      render();
    }

    function productSaveErrors() {
      const errors = [];
      numericInputErrors.forEach(message => errors.push(message));
      const productIds = new Set();
      const productSkus = new Set();
      const variantSkuOwners = new Map();
      const originalVariantSkus = {};
      const allowedCategories = new Set(CATEGORIES.map(([value]) => value));
      Object.entries(originalProductSnapshots).forEach(([productId, snapshot]) => {
        try {
          const originalProduct = JSON.parse(snapshot);
          (originalProduct.variants || []).forEach(variant => {
            originalVariantSkus[`${productId}|${variant.id}`] = String(variant.sku || '').trim();
          });
        } catch {}
      });
      products.forEach((product, index) => {
        const name = String(product.name || '').trim();
        const label = name || `Sản phẩm ${index + 1}`;
        const productId = String(product.id || '').trim();
        if (!productId) errors.push(`${label}: thiếu ID sản phẩm.`);
        else if (productIds.has(productId)) errors.push(`${label}: ID sản phẩm bị trùng.`);
        productIds.add(productId);
        if (!name) errors.push(`Sản phẩm ${index + 1}: hãy nhập tên.`);
        if (!allowedCategories.has(product.categoryId)) errors.push(`${label}: hãy chọn danh mục hợp lệ.`);
        if (!Number.isFinite(Number(product.price)) || Number(product.price) < 0 || (!isHidden(product) && Number(product.price) <= 0)) errors.push(`${label}: giá bán phải lớn hơn 0 với sản phẩm đang hiện.`);
        if (product.originalPrice != null && (!Number.isFinite(Number(product.originalPrice)) || Number(product.originalPrice) < 0)) errors.push(`${label}: giá gốc không hợp lệ.`);
        if (product.weight != null && (!Number.isFinite(Number(product.weight)) || Number(product.weight) < 0)) errors.push(`${label}: khối lượng không hợp lệ.`);
        const productSku = String(product.sku || '').trim();
        if (productSku && productSkus.has(productSku)) errors.push(`${label}: SKU sản phẩm bị trùng.`);
        if (productSku) productSkus.add(productSku);
        if (!Array.isArray(product.images) || product.images.length > 9) errors.push(`${label}: chỉ được có tối đa 9 ảnh.`);

        const variants = Array.isArray(product.variants) ? product.variants : [];
        const variantIds = new Set();
        variants.forEach((variant, variantIndex) => {
          const variantName = String(variant.name || '').trim();
          const variantId = String(variant.id || '').trim();
          if (!variantId) errors.push(`${label}: phân loại ${variantIndex + 1} thiếu ID.`);
          else if (variantIds.has(variantId)) errors.push(`${label}: ID phân loại bị trùng.`);
          variantIds.add(variantId);
          if (!variantName) errors.push(`${label}: hãy đặt tên cho phân loại ${variantIndex + 1}.`);
          if (!Number.isFinite(Number(variant.price)) || Number(variant.price) < 0 || (!isHidden(product) && Number(variant.price) <= 0)) errors.push(`${label}: giá phân loại “${variantName || variantIndex + 1}” phải lớn hơn 0 với sản phẩm đang hiện.`);
          if (variant.originalPrice != null && (!Number.isFinite(Number(variant.originalPrice)) || Number(variant.originalPrice) < 0)) errors.push(`${label}: giá gốc phân loại “${variantName}” không hợp lệ.`);
          if (variant.weight != null && (!Number.isFinite(Number(variant.weight)) || Number(variant.weight) < 0)) errors.push(`${label}: khối lượng phân loại “${variantName}” không hợp lệ.`);
          const variantSku = String(variant.sku || '').trim();
          if (variantSku) {
            const owners = variantSkuOwners.get(variantSku) || [];
            owners.push({ key: `${productId}|${variantId}`, label: `${label} / ${variantName}` });
            variantSkuOwners.set(variantSku, owners);
          }
        });

        const changed = !originalProductSnapshots[productId] || originalProductSnapshots[productId] !== JSON.stringify(product);
        if (changed) {
          const groups = Array.isArray(product.optionGroups) ? product.optionGroups : [];
          let originalProduct;
          try {
            originalProduct = JSON.parse(originalProductSnapshots[productId] || 'null');
          } catch {
            originalProduct = null;
          }
          const originalGroups = Array.isArray(originalProduct?.optionGroups) ? originalProduct.optionGroups : [];
          const allowedLegacyReferences = new Set();
          (originalProduct?.variants || []).forEach(originalVariant => {
            originalGroups.forEach(originalGroup => {
              const value = originalVariant.options?.[originalGroup.name];
              if (value && !(originalGroup.values || []).includes(value)) {
                allowedLegacyReferences.add(JSON.stringify([String(originalVariant.id), originalGroup.name, value]));
              }
            });
          });
          const groupNames = new Set();
          groups.forEach(group => {
            const groupName = String(group.name || '').trim();
            const values = (group.values || []).map(value => String(value || '').trim());
            if (!groupName) errors.push(`${label}: nhóm tùy chọn thiếu tên.`);
            if (groupNames.has(groupName)) errors.push(`${label}: tên nhóm “${groupName}” bị trùng.`);
            groupNames.add(groupName);
            if (new Set(values).size !== values.length) errors.push(`${label}: có giá trị phân loại bị trùng trong nhóm “${groupName}”.`);
          });
          variants.forEach(variant => {
            groups.forEach(group => {
              const selectedValue = variant.options?.[group.name];
              const reference = JSON.stringify([String(variant.id), group.name, selectedValue]);
              if (selectedValue && !(group.values || []).includes(selectedValue) && !allowedLegacyReferences.has(reference)) {
                errors.push(`${label}: phân loại “${variant.name}” đang tham chiếu giá trị không còn trong nhóm “${group.name}”.`);
              }
            });
          });
        }
      });
      for (const [sku, owners] of variantSkuOwners) {
        if (owners.length < 2) continue;
        const changedOwner = owners.find(({ key }) => !Object.prototype.hasOwnProperty.call(originalVariantSkus, key) || originalVariantSkus[key] !== sku);
        if (changedOwner) errors.push(`${changedOwner.label}: SKU phân loại “${sku}” đã được dùng ở phân loại khác.`);
      }
      const visibleNames = new Set();
      products.forEach(product => {
        if (isHidden(product)) return;
        const key = String(product.name || '').trim().toLocaleLowerCase('vi');
        if (!key) return;
        if (visibleNames.has(key)) errors.push(`${product.name}: trùng tên với một sản phẩm đang hiện khác; hãy đổi tên hoặc ẩn một sản phẩm.`);
        visibleNames.add(key);
      });
      return [...new Set(errors)];
    }

    async function saveProducts() {
      if (!apiOnline) throw new Error('Chế độ mở file tĩnh không lưu trực tiếp được. Hãy chạy node tools/local_admin_server.js rồi mở admin qua http://127.0.0.1:8000/admin-upload.html.');
      if (pendingUploads) throw new Error('Hãy chờ tải ảnh xong trước khi lưu sản phẩm.');
      const errors = productSaveErrors();
      if (errors.length) throw new Error(`Cần sửa các mục sau trước khi lưu:\n• ${errors.slice(0, 12).join('\n• ')}`);
      const submittedProducts = JSON.stringify(products);
      const res = await fetch(API_PRODUCTS, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ products: products.map(normalizeProduct), revision: productRevision })
      });
      const data = await readJsonResponse(res, 'API sản phẩm');
      if (!data.ok) throw new Error(data.message || 'Lưu thất bại.');
      const savedProducts = (data.products || []).map(normalizeProduct);
      productRevision = data.revision || productRevision;
      originalProductSnapshots = Object.fromEntries(savedProducts.map(product => [String(product.id), JSON.stringify(product)]));
      if (JSON.stringify(products) !== submittedProducts) {
        writeProductDraft();
        throw new Error('Đã lưu phiên bản trước. Có chỉnh sửa mới trong lúc lưu; hãy kiểm tra và bấm Lưu local lần nữa.');
      }
      products = savedProducts;
      productDraftDirty = false;
      clearTimeout(productDraftTimer);
      numericInputErrors.clear();
      localStorage.removeItem(PRODUCT_DRAFT_KEY);
    }

    async function saveAll() {
      if (saving) return;
      saving = true;
      render();
      try {
        await saveProducts();
        await saveSettings();
        alert('Đã lưu local và build lại trang SEO/sitemap. Bấm Preview để kiểm tra trước khi Push Git.');
      } catch (error) {
        alert(error.message);
      } finally {
        saving = false;
        render();
      }
    }

    function previewWebsite() {
      window.open(`${window.location.origin}/?preview=${Date.now()}`, '_blank');
    }

    async function pushGit() {
      if (saving) return;
      if (!apiOnline) {
        alert('Push Git chỉ dùng được khi chạy admin bằng node tools/local_admin_server.js.');
        return;
      }
      const ok = confirm('Push Git sẽ commit trang admin, server admin và các file dữ liệu/ảnh/trang sản phẩm liên quan rồi đẩy lên GitHub. Thay đổi được stage sẵn sẽ khiến thao tác bị dừng để tránh gộp nhầm. Tiếp tục?');
      if (!ok) return;
      saving = true;
      render();
      try {
        await saveProducts();
        await saveSettings();
        const res = await fetch(API_GIT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'push' })
        });
        const data = await readJsonResponse(res, 'API Git');
        if (!data.ok) throw new Error(data.message || 'Push Git thất bại.');
        alert(data.git?.message || 'Đã push lên GitHub.');
      } catch (error) {
        alert(error.message);
      } finally {
        saving = false;
        render();
      }
    }

    window.addEventListener('beforeunload', event => {
      if (!productDraftDirty && !pendingUploads && !saving) return;
      if (productDraftDirty) writeProductDraft();
      event.preventDefault();
      event.returnValue = '';
    });

    loadProducts();
  </script>
</body>
</html>
