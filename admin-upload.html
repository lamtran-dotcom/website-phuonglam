<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phương Lâm Admin - Upload sản phẩm</title>
  <style>
    :root {
      --green: #2f7d24;
      --green-dark: #25651d;
      --soft: #f5faf2;
      --line: #dde8d8;
      --text: #1f1f1f;
      --muted: #777;
      --danger: #d64545;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
      background: linear-gradient(135deg, #fbfff8, #f3f8ef);
      color: var(--text);
    }

    .wrap { max-width: 1440px; margin: 0 auto; padding: 28px; }
    .topbar { position: sticky; top: 0; z-index: 20; display: flex; justify-content: space-between; gap: 16px; align-items: center; margin: -8px 0 18px; padding: 10px 0; background: rgba(249,253,247,.96); backdrop-filter: blur(14px); }
    h1 { margin: 0; font-size: 34px; letter-spacing: -.03em; }
    .sub { color: var(--muted); margin-top: 6px; }
    .panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 18px 50px rgba(38, 91, 30, .08);
    }

    .login { max-width: 480px; margin: 80px auto; padding: 28px; }
    .grid { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 20px; align-items: start; }
    .side { padding: 16px; position: sticky; top: 94px; max-height: calc(100vh - 112px); overflow: auto; }
    .editor { padding: 22px; min-width: 0; }

    input, textarea, select, button {
      font: inherit;
      border-radius: 14px;
    }
    input, textarea, select {
      width: 100%;
      border: 1px solid #ddd;
      padding: 13px 14px;
      background: #fff;
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(47,125,36,.12); }
    textarea { min-height: 100px; resize: vertical; }
    label { display: block; font-weight: 800; color: #4b4b4b; margin: 14px 0 7px; }

    button {
      border: 0;
      padding: 12px 18px;
      background: var(--green);
      color: #fff;
      font-weight: 900;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(47,125,36,.18); }
    button.secondary { background: #fff; color: var(--green); border: 1px solid var(--line); }
    button.danger { background: #fff5f5; color: var(--danger); border: 1px solid #ffd0d0; }
    button.small { padding: 9px 12px; font-size: 13px; }

    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .tab {
      background: #fff;
      color: #4f614b;
      border: 1px solid var(--line);
      padding: 10px 16px;
      border-radius: 999px;
      box-shadow: none;
    }
    .tab.active {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }
    .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .card-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .config-images { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
    .config-card-grid { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
    .status { margin-top: 12px; font-weight: 800; color: var(--green); }

    .product-item {
      display: grid;
      grid-template-columns: 58px 1fr;
      gap: 12px;
      padding: 12px;
      border-radius: 16px;
      cursor: pointer;
      border: 1px solid transparent;
      margin-bottom: 8px;
    }
    .product-item.active { background: var(--soft); border-color: var(--line); }
    .product-item.is-hidden { opacity: .58; background: #fbfbfb; }
    .product-item { align-items: center; transition: background .16s ease, border-color .16s ease; }
    .product-item:hover { background: #f7fbf5; border-color: var(--line); }
    .product-item .name { display: -webkit-box; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .product-list-toolbar { display: grid; grid-template-columns: minmax(0, 1fr) 130px; gap: 8px; margin: 10px 0; }
    .product-list-count { margin: 8px 2px; font-size: 12px; color: var(--muted); }
    .product-editor-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
    .product-editor-heading h2 { margin: 0; }
    .product-editor-summary { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
    .product-editor-summary span { border: 1px solid var(--line); border-radius: 999px; background: #f8fbf6; padding: 5px 9px; font-size: 12px; color: #53634f; }
    .product-section-tabs { position: sticky; top: 88px; z-index: 10; display: flex; gap: 7px; overflow-x: auto; margin: 0 -6px 20px; padding: 8px 6px 12px; background: rgba(255,255,255,.96); border-bottom: 1px solid #edf1ea; }
    .product-section-tab { flex: 0 0 auto; padding: 9px 13px; color: #53634f; background: #f7faf5; border: 1px solid var(--line); border-radius: 999px; box-shadow: none; font-size: 13px; }
    .product-section-tab[aria-selected="true"] { color: #fff; background: var(--green); border-color: var(--green); }
    .product-edit-section[hidden] { display: none !important; }
    .product-edit-section > h2:first-child { margin-top: 4px; }
    .editor-hint { margin: 6px 0 14px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .seo-preview-card { padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: #fbfcfa; margin-top: 16px; }
    .seo-preview-title { color: #1a0dab; font-size: 18px; margin: 4px 0; }
    .seo-preview-url { color: #188038; font-size: 12px; }
    .seo-preview-description { color: #4d5156; font-size: 13px; line-height: 1.5; }
    .editor-save-dock { position: sticky; bottom: 10px; z-index: 9; display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 24px -8px -8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.97); box-shadow: 0 -8px 26px rgba(38,91,30,.09); }
    .editor-save-dock span { color: var(--muted); font-size: 13px; }
    .hidden-badge {
      display: inline-flex;
      align-items: center;
      margin-left: 6px;
      padding: 2px 7px;
      border-radius: 999px;
      background: #888;
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      vertical-align: middle;
    }
    .thumb {
      width: 58px;
      height: 58px;
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      background: repeating-linear-gradient(45deg, #eef5ec, #eef5ec 10px, #f7fbf5 10px, #f7fbf5 20px);
      object-fit: cover;
      overflow: hidden;
      display: grid;
      place-items: center;
      color: #999;
      font-size: 11px;
    }
    .name { font-weight: 900; line-height: 1.25; }
    .price { color: var(--green); font-weight: 900; margin-top: 4px; }
    .muted { color: var(--muted); }

    .images {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .product-images {
      grid-template-columns: repeat(auto-fill, minmax(76px, 134px));
      justify-content: start;
    }
    .image-box {
      width: 100%;
      border: 2px dashed #d7d7d7;
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      background: #fafafa;
      display: grid;
      place-items: center;
      text-align: center;
      color: #aaa;
      cursor: pointer;
      overflow: hidden;
      position: relative;
      transition: border-color .18s ease, background .18s ease, box-shadow .18s ease, transform .18s ease;
    }
    .image-box.dragging,
    .variant-img.dragging {
      border-color: var(--green);
      background: #f1faee;
      box-shadow: 0 16px 34px rgba(47,125,36,.16);
      transform: translateY(-2px);
    }
    .image-box img { width: 100%; height: 100%; object-fit: cover; }
    .image-box span { padding: 10px; }
    .config-image-box { border-radius: 14px; font-size: 12px; }
    .remove-img {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255,255,255,.92);
      color: var(--danger);
      border: 1px solid #ffd0d0;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
    }

    .variant {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px;
      margin-top: 12px;
      background: #fff;
    }
    .variant-grid {
      display: grid;
      grid-template-columns: 82px 1.2fr .8fr .8fr .7fr .8fr 70px;
      gap: 10px;
      align-items: end;
    }
    .variant-img {
      width: 72px;
      height: 72px;
      aspect-ratio: 1 / 1;
      border: 1px dashed #ccc;
      border-radius: 14px;
      background: #fafafa;
      display: grid;
      place-items: center;
      overflow: hidden;
      cursor: pointer;
      color: #999;
      font-size: 12px;
      transition: border-color .18s ease, background .18s ease, box-shadow .18s ease, transform .18s ease;
      position: relative;
    }
    .variant-img img { width: 100%; height: 100%; object-fit: cover; }
    .variant-img .hint {
      padding: 6px;
      line-height: 1.25;
      font-size: 11px;
      font-weight: 800;
      color: #79a274;
    }
    .variant-img .remove-img {
      top: 4px;
      right: 4px;
      padding: 3px 6px;
      font-size: 11px;
    }
    .option-group-grid {
      display: grid;
      grid-template-columns: minmax(180px, .75fr) minmax(260px, 1.7fr) auto;
      gap: 12px;
      align-items: start;
    }
    .option-value-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .option-value-pill {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1.5px solid #dbe8d7;
      border-radius: 10px;
      background: #fbfdfb;
      padding: 2px 4px 2px 8px;
    }
    .option-value-pill input {
      width: 118px;
      min-width: 70px;
      border: 0;
      background: transparent;
      padding: 4px 2px;
      font-weight: 800;
      font-size: 13px;
    }
    .option-value-pill input:focus {
      outline: 0;
      box-shadow: none;
    }
    .option-value-remove,
    .option-value-add {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      display: inline-grid;
      place-items: center;
      font-weight: 900;
      cursor: pointer;
    }
    .option-value-remove {
      border: 1px solid #ffd0d0;
      background: #fff8f8;
      color: var(--danger);
    }
    .option-value-add {
      border: 1.5px dashed #9fc899;
      background: #f4fbf2;
      color: var(--green);
      font-size: 19px;
    }
    .mini-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px;
      background: #fff;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .mini-card.active {
      border-color: var(--green);
      background: #f3fbf1;
      box-shadow: 0 12px 28px rgba(47,125,36,.12);
    }
    .mini-card:hover { transform: translateY(-2px); }
    .config-mini { padding: 8px; border-radius: 14px; }
    .config-mini .name { font-size: 13px; }
    .featured-slots {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(142px, 1fr));
      gap: 12px;
    }
    .featured-slot {
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .featured-slot.active { border-color: var(--green); background: #f3fbf1; }
    .featured-slot:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(47,125,36,.12); }
    .featured-slot-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      background: repeating-linear-gradient(45deg, #eef5ec, #eef5ec 10px, #f7fbf5 10px, #f7fbf5 20px);
      overflow: hidden;
      display: grid;
      place-items: center;
      color: #999;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .featured-slot-img img { width: 100%; height: 100%; object-fit: cover; }
    .slot-no { font-size: 12px; color: var(--green); font-weight: 900; margin-bottom: 4px; }
    .slot-name { font-size: 12px; font-weight: 900; line-height: 1.3; min-height: 32px; }
    .slot-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 8px; }
    .slot-actions button { padding: 7px 5px; font-size: 11px; border-radius: 10px; }
    .picker-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(17, 28, 14, .38);
      display: grid;
      place-items: center;
      padding: 18px;
    }
    .picker-modal {
      width: min(980px, 100%);
      max-height: min(760px, calc(100vh - 36px));
      overflow: auto;
      background: #fff;
      border-radius: 20px;
      border: 1px solid var(--line);
      box-shadow: 0 26px 80px rgba(20, 40, 16, .24);
      padding: 18px;
    }
    .picker-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 12px; }
    .picker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .picker-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 8px;
      background: #fff;
      cursor: pointer;
    }
    .picker-card:hover { border-color: var(--green); box-shadow: 0 10px 24px rgba(47,125,36,.12); }
    .picker-card.selected { border-color: var(--green); background: #f3fbf1; }
    .picker-card.is-hidden { opacity: .48; }
    .picker-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 11px;
      overflow: hidden;
      background: #f2f6ef;
      display: grid;
      place-items: center;
      color: #999;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .picker-img img { width: 100%; height: 100%; object-fit: cover; }
    .picker-title { font-size: 12px; font-weight: 900; line-height: 1.35; min-height: 48px; }
    .picker-price { color: var(--green); font-size: 12px; font-weight: 900; margin-top: 5px; }
    .blog-image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .blog-image-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      padding: 8px;
    }
    .blog-image-card .image-box {
      border-radius: 12px;
      font-size: 12px;
      aspect-ratio: 16 / 10;
    }
    .blog-image-name {
      margin-top: 7px;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.3;
      color: #465742;
      overflow-wrap: anywhere;
    }
    .blog-prompt-text {
      margin-top: 7px;
      padding: 9px;
      border-radius: 10px;
      background: #f7fbf5;
      color: #61715d;
      font-size: 11px;
      line-height: 1.45;
      max-height: 94px;
      overflow: auto;
    }
    .blog-seo-checks {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }
    .blog-seo-check {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      padding: 9px 11px;
      border-radius: 12px;
      border: 1px solid #dde8d8;
      background: #fff;
      font-size: 12px;
    }
    .blog-seo-check.ok { background: #f2fbef; border-color: #cbe7c3; }
    .blog-seo-check.warn { background: #fffaf0; border-color: #f3ddaa; }
    .blog-seo-check.error { background: #fff5f5; border-color: #ffd0d0; }
    .blog-seo-dot {
      flex: 0 0 auto;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      margin-top: 4px;
      background: #d98221;
    }
    .blog-seo-check.ok .blog-seo-dot { background: var(--green); }
    .blog-seo-check.error .blog-seo-dot { background: var(--danger); }
    .blog-image-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
      margin-top: 7px;
    }
    .blog-image-actions button {
      padding: 7px 8px;
      border-radius: 9px;
      font-size: 11px;
    }
    .order-table { width: 100%; border-collapse: collapse; min-width: 780px; }
    .order-table th, .order-table td { padding: 12px 10px; border-bottom: 1px solid #eef2eb; text-align: left; vertical-align: top; }
    .order-table th { color: #66705f; font-size: 13px; }

    .empty { padding: 30px; text-align: center; color: var(--muted); }

    @media (max-width: 900px) {
      .wrap { padding: 16px; }
      .topbar, .grid { display: block; }
      .side { position: static; max-height: 350px; margin-bottom: 16px; }
      .row, .row3, .images, .variant-grid, .card-grid { grid-template-columns: 1fr; }
      .option-group-grid { grid-template-columns: 1fr; }
      .config-images, .config-card-grid, .featured-slots, .picker-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      h1 { font-size: 28px; }
      .editor { padding: 16px; }
      .product-section-tabs { top: 0; margin-top: 10px; }
      .product-list-toolbar { grid-template-columns: 1fr; }
      .topbar { position: static; align-items: flex-start; flex-direction: column; }
      .topbar > .actions { width: 100%; }
      .editor-save-dock { bottom: 6px; }
    }

    /* Product workspace: compact catalog and marketplace-style selling editor. */
    .grid { grid-template-columns: 280px minmax(0, 1fr); }
    .wrap { max-width: 1720px; }
    .grid .panel { border-radius: 10px; box-shadow: 0 2px 8px #23351c08; }
    .grid input, .grid textarea, .grid select, .grid button { border-radius: 5px; }
    .grid input, .grid select { padding: 10px 12px; }
    .grid .editor { background: #f6f7f8; padding: 20px; }
    .product-edit-section { background: white; border: 1px solid #e5e7e9; border-radius: 8px; padding: 24px; }
    .product-edit-section h2 { font-size: 23px; }
    .product-section-tabs { top: 100px; padding: 0; gap: 0; margin: 0 0 20px; border-radius: 6px; }
    .product-section-tab { background: white; border: 0; border-bottom: 3px solid transparent; padding: 17px 16px; font-size: 14px; }
    .product-section-tab[aria-selected="true"] { background: white; color: var(--green); border-color: var(--green); }
    .product-list-toolbar { grid-template-columns: 1fr; }
    .product-item { border-radius: 6px; padding: 10px 6px; border-bottom: 1px solid #eee; font-size: 13px; }
    .product-item .muted { font-size: 11px; margin-top: 6px; }
    .product-images { grid-template-columns: repeat(auto-fill, minmax(80px, 106px)); margin: 18px 0 24px; }
    .product-images .image-box { border-radius: 5px; border-width: 1px; }
    .cover-label { position: absolute; bottom: 0; width: 100%; background: #285d26cc; color: white; font-size: 11px; padding: 4px !important; }
    .sales-group { background: #f6f7f8; border: 0; border-radius: 6px; padding: 20px; }
    .sales-group .option-group-grid { grid-template-columns: minmax(0,1fr) auto; }
    .sales-group .option-group-grid > div:nth-child(2) { grid-column: 1 / -1; grid-row: 2; }
    .sales-group .option-value-list { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
    .sales-group .option-value-pill { background: white; border: 1px solid #ddd; border-radius: 5px; min-width: 0; }
    .sales-group .option-value-pill input { width: 100%; min-width: 0; }
    .sales-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 20px 0 12px; }
    .sales-toolbar h3 { margin: 0 auto 0 0; }
    .bulk-prices { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)) auto; gap: 10px; background: #f6f7f8; padding: 14px; margin: 14px 0 20px; border-radius: 6px; align-items: end; }
    .bulk-prices label { font-size: 12px; margin: 0 0 6px; }
    .sales-table-wrap { overflow: auto; border: 1px solid #e1e4e6; border-radius: 6px; }
    .sales-table { width: 100%; min-width: 880px; border-collapse: collapse; table-layout: fixed; }
    .sales-table th { background: #f6f7f8; color: #555; padding: 15px 12px; font-size: 13px; font-weight: 600; text-align: left; }
    .sales-table td { padding: 16px 12px; border: 1px solid #e6e8ea; vertical-align: top; }
    .sales-table th:first-child { width: 31%; }
    .sales-table th:last-child { width: 70px; }
    .sales-table input { font-size: 13px; }
    .sales-table .variant-identity { display: flex; gap: 10px; align-items: start; }
    .sales-table .variant-identity > div:last-child { min-width: 0; flex: 1; }
    .sales-table .variant-img { width: 58px; height: 58px; flex-shrink: 0; border-radius: 5px; }
    .sales-table label { font-size: 11px; margin: 8px 0 4px; }
    .sales-table select { font-size: 12px; }
    .sales-empty { text-align: center; padding: 35px; border: 1px dashed #ddd; border-radius: 6px; }
    @media(max-width: 1100px) { .grid { grid-template-columns: 240px minmax(0,1fr); } .bulk-prices { grid-template-columns: repeat(2,minmax(0,1fr)); } }
    @media(max-width: 760px) { .grid { grid-template-columns: 1fr; } .grid .side { position: static; max-height: 340px; } .grid .editor, .product-edit-section { padding: 14px; } .sales-group .option-value-list, .bulk-prices { grid-template-columns: 1fr; } .product-editor-heading { flex-direction: column; } .product-section-tabs { top: 0; } .editor-save-dock { flex-wrap: wrap; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="app"></div>
  </div>

  <script>
    const API_PRODUCTS = 'api/products.php';
    const API_UPLOAD = 'api/upload.php';
    const API_SETTINGS = 'api/settings.php';
    const API_ORDERS = 'api/orders.php';
    const API_GIT = 'api/git.php';
    const API_BLOG = 'api/blog.php';
    const API_BLOG_PREVIEW = 'api/blog-preview.php';
    const PUBLIC_SITE_URL = 'https://phuonglam.com';
    const PRODUCT_DRAFT_KEY = 'phuonglam_admin_product_draft_v1';
    const CATEGORY_ALIASES = { 'tinh-dau': 'bep-xong' };
    const normalizeCategoryId = value => CATEGORY_ALIASES[String(value || '')] || String(value || 'nen-thom');
    const CATEGORIES = [
      ['nen-thom', 'Nến Xông'],
      ['combo', 'Combo Xông Nhà'],
      ['thao-moc-xong', 'Thảo Mộc Xông'],
      ['tui-thom', 'Túi thơm'],
      ['go-thom', 'Gỗ thơm'],
      ['bep-xong', 'Đèn Xông Tinh Dầu'],
      ['nen-tru', 'Nến Trụ'],
      ['nu-tram', 'Nụ Trầm'],
      ['phu-kien', 'Phụ Kiện Xông'],
      ['nen-ly', 'Nến Ly']
    ];
    const PRODUCT_TAGS = ['', 'Bán chạy', 'Mới', 'Nổi bật', 'Sale', 'Hết hàng'];

    let products = [];
    let productRevision = '';
    let productDraftDirty = false;
    let productDraftTimer = null;
    let productDraftStorageFailed = false;
    let originalProductSnapshots = {};
    let pendingUploads = 0;
    const numericInputErrors = new Map();
    let settings = { featuredIds: [], headerImages: [], categoryImages: {} };
    let orders = [];
    let selectedId = null;
    let variantEditorColor = '';
    let listSearch = '';
    let listCategory = '';
    let listVisibility = 'all';
    let activeTab = 'products';
    let productEditorSection = 'details';
    let featuredPickerIndex = null;
    let featuredPickerSearch = '';
    let saving = false;
    let apiOnline = true;
    let blogPosts = [];
    let blogCategory = 'huong-dan-xong';
    let blogSlug = '';
    let blogZipFile = null;
    let blogPreviewImages = [];
    let blogImageReplacements = [];
    let blogImageReplacementPreviews = [];
    let blogPreviewLoading = false;
    let blogPreviewError = '';
    let blogSeoChecks = [];
    let blogSaving = false;
    const app = document.getElementById('app');

    const fmt = value => Number(value || 0).toLocaleString('vi-VN') + 'đ';
    const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
    const jsString = value => JSON.stringify(String(value ?? '')).replace(/</g, '\\u003c');
    const jsAttr = value => esc(jsString(value));
    const publicSiteUrl = value => {
      const raw = String(value || '/').trim() || '/';
      try {
        const parsed = new URL(raw, PUBLIC_SITE_URL);
        return `${PUBLIC_SITE_URL}${parsed.pathname}${parsed.search}${parsed.hash}`;
      } catch {
        return `${PUBLIC_SITE_URL}/${raw.replace(/^\/+/, '')}`;
      }
    };
    const setBlogPosts = posts => {
      blogPosts = Array.isArray(posts) ? posts.slice() : [];
    };
    const parseNumberInput = value => {
      if (value === '' || value == null) return null;
      if (typeof value === 'number') return Number.isFinite(value) ? value : null;
      const normalized = String(value)
        .trim()
        .replace(/\s+/g, '')
        .replace(/[,.]/g, '');
      if (!normalized) return null;
      const number = Number(normalized);
      return Number.isFinite(number) ? number : null;
    };
    const numberInputAttrs = 'type="text" inputmode="numeric" pattern="[0-9., ]*"';
    const normalizeText = value => String(value ?? '')
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/đ/g, 'd')
      .trim();
    const isColorOptionGroup = group => ['mau', 'color'].includes(normalizeText(group?.name));
    const colorSwatch = value => {
      const key = normalizeText(value);
      if (key.includes('trang') || key.includes('white')) return { background: '#fff', border: '#cfd8cf' };
      if (key.includes('huong lai') || key.includes('lai')) return { background: '#f5c84c', border: '#d5a91f' };
      if (key.includes('vang') || key.includes('yellow')) return { background: '#f5c84c', border: '#d5a91f' };
      if (key.includes('do') || key.includes('red')) return { background: '#d93636', border: '#b72525' };
      return { background: '#dfe6dc', border: '#bac8b8' };
    };
    const id = () => 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
    const firstImage = product => (product.images || []).find(Boolean) || (product.variants || []).map(v => v.image).find(Boolean) || '';
    const isHidden = product => product?.hidden === true || product?.hidden === 'true';
    const pl004QuantityFromName = name => {
      const text = normalizeText(name);
      if (text.includes('100')) return 'Hộp 100 Viên 4h';
      if (text.includes('50')) return '50 Viên 4h';
      return '2 Vỉ 4h = 20 viên';
    };
    const normalizePl004Options = product => {
      if (product?.sku !== 'PL-004') return product;
      return {
        ...product,
        optionGroups: [
          { name: 'Màu', values: ['Hương lài'] },
          { name: 'Số lượng', values: ['2 Vỉ 4h = 20 viên', '50 Viên 4h', 'Hộp 100 Viên 4h'] }
        ],
        variants: (product.variants || []).map(variant => ({
          ...variant,
          options: {
            'Màu': 'Hương lài',
            'Số lượng': pl004QuantityFromName(variant.name)
          }
        }))
      };
    };
    const selectedProduct = () => products.find(product => String(product.id) === String(selectedId));

    function updateDraftStatus() {
      const status = document.getElementById('productDraftStatus');
      if (!status) return;
      status.textContent = pendingUploads
        ? `Đang tải ${pendingUploads} ảnh; hãy chờ tải xong rồi mới lưu.`
        : productDraftDirty
          ? productDraftStorageFailed
            ? 'Có thay đổi chưa lưu; trình duyệt không giữ được bản nháp tự động. Hãy lưu trước khi rời trang.'
            : 'Có thay đổi sản phẩm chưa lưu. Bản nháp đang được giữ trên trình duyệt này.'
          : '';
      status.style.color = productDraftStorageFailed ? '#b45f00' : '#8a5b00';
    }

    function writeProductDraft() {
      try {
        localStorage.setItem(PRODUCT_DRAFT_KEY, JSON.stringify({
          revision: productRevision,
          savedAt: new Date().toISOString(),
          products,
          numericInputErrors: [...numericInputErrors.entries()],
        }));
        productDraftStorageFailed = false;
      } catch (error) {
        productDraftStorageFailed = true;
        console.warn('Không thể lưu bản nháp sản phẩm trên trình duyệt.', error);
      }
      updateDraftStatus();
    }

    function scheduleProductDraftSave() {
      productDraftDirty = true;
      clearTimeout(productDraftTimer);
      productDraftTimer = setTimeout(writeProductDraft, 350);
      updateDraftStatus();
    }

    function restoreProductDraft(serverProducts, revision) {
      let draft;
      try {
        draft = JSON.parse(localStorage.getItem(PRODUCT_DRAFT_KEY) || 'null');
      } catch {
        localStorage.removeItem(PRODUCT_DRAFT_KEY);
        return serverProducts;
      }
      if (!Array.isArray(draft?.products)) return serverProducts;
      const changedBase = draft.revision && revision && draft.revision !== revision;
      const message = changedBase
        ? 'Bản nháp được tạo từ dữ liệu cũ hơn. Khôi phục sẽ thay danh sách hiện tại trong admin bằng bản nháp trên máy này. Tiếp tục?'
        : 'Có bản nháp sản phẩm chưa lưu từ phiên trước. Khôi phục bản nháp?';
      if (!confirm(message)) {
        localStorage.removeItem(PRODUCT_DRAFT_KEY);
        return serverProducts;
      }
      productDraftDirty = true;
      numericInputErrors.clear();
      (Array.isArray(draft.numericInputErrors) ? draft.numericInputErrors : []).forEach(([key, message]) => numericInputErrors.set(key, message));
      return draft.products.map(normalizeProduct);
    }

    async function readJsonResponse(response, label) {
      const text = await response.text();
      try {
        return JSON.parse(text);
      } catch {
        if (text.trim().startsWith('<?php')) {
          throw new Error(`${label} chưa chạy được vì preview local không thực thi PHP.`);
        }
        throw new Error(`${label} trả về dữ liệu không đúng định dạng JSON.`);
      }
    }

    function normalizeProduct(product) {
      const normalized = {
        id: product.id || id(),
        slug: product.slug || '',
        sku: product.sku || '',
        categoryId: normalizeCategoryId(product.categoryId),
        name: product.name || '',
        price: parseNumberInput(product.price) || 0,
        originalPrice: parseNumberInput(product.originalPrice),
        shortDesc: product.shortDesc || '',
        description: product.description || '',
        usage: product.usage || '',
        seoTitle: product.seoTitle || '',
        seoDescription: product.seoDescription || '',
        tag: product.tag || '',
        weight: parseNumberInput(product.weight),
        hidden: isHidden(product),
        optionGroups: Array.isArray(product.optionGroups) ? product.optionGroups.map(group => ({
          name: group.name || '',
          values: Array.isArray(group.values) ? group.values.map(value => String(value || '').trim()).filter(Boolean) : []
        })).filter(group => group.name && group.values.length) : [],
        optionImages: product.optionImages && typeof product.optionImages === 'object' && !Array.isArray(product.optionImages)
          ? Object.fromEntries(Object.entries(product.optionImages).map(([groupName, values]) => [
            groupName,
            values && typeof values === 'object' && !Array.isArray(values)
              ? Object.fromEntries(Object.entries(values).filter(([, src]) => !!src))
              : {}
          ]))
          : {},
        images: Array.isArray(product.images) ? product.images.filter(Boolean).slice(0, 9) : [],
        reviews: Array.isArray(product.reviews) ? product.reviews : [],
        variants: Array.isArray(product.variants) ? product.variants.map(v => ({
          id: v.id || id(),
          name: v.name || '',
          sku: v.sku || '',
          price: parseNumberInput(v.price) || 0,
          originalPrice: parseNumberInput(v.originalPrice),
          weight: parseNumberInput(v.weight),
          image: v.image || '',
          options: v.options && typeof v.options === 'object' && !Array.isArray(v.options) ? v.options : {}
        })) : []
      };
      return normalizePl004Options(normalized);
    }

    async function loadProducts() {
      app.innerHTML = '<div class="panel empty">Đang tải dữ liệu quản trị...</div>';
      try {
        const [productRes, settingRes, orderRes, blogRes] = await Promise.all([
          fetch(API_PRODUCTS, { cache: 'no-store' }),
          fetch(API_SETTINGS, { cache: 'no-store' }),
          fetch(API_ORDERS, { cache: 'no-store' }).catch(() => null),
          fetch(API_BLOG, { cache: 'no-store' }).catch(() => null)
        ]);
        const productData = await readJsonResponse(productRes, 'API sản phẩm');
        const settingData = await readJsonResponse(settingRes, 'API cài đặt');
        const orderData = orderRes ? await readJsonResponse(orderRes, 'API đơn hàng') : { ok: true, orders: [] };
        const blogData = blogRes ? await readJsonResponse(blogRes, 'API Blog').catch(() => ({ ok: false })) : { ok: false };
        if (!productData.ok) throw new Error(productData.message || 'Không tải được dữ liệu sản phẩm.');
        if (!settingData.ok) throw new Error(settingData.message || 'Không tải được cài đặt website.');
        apiOnline = true;
        productRevision = productData.revision || '';
        const serverProducts = (productData.products || []).map(normalizeProduct);
        originalProductSnapshots = Object.fromEntries(serverProducts.map(product => [String(product.id), JSON.stringify(product)]));
        products = restoreProductDraft(serverProducts, productRevision);
        settings = normalizeSettings(settingData.settings || {});
        orders = Array.isArray(orderData.orders) ? orderData.orders : [];
        setBlogPosts(blogData.ok ? (blogData.posts || []) : []);
        selectedId = products[0]?.id || null;
        render();
      } catch (error) {
        try {
          const localRes = await fetch('data/products.json', { cache: 'no-store' });
          const localData = await localRes.json();
          const localProducts = Array.isArray(localData) ? localData : (localData.products || []);
          apiOnline = false;
          productRevision = '';
          products = localProducts.map(normalizeProduct);
          settings = normalizeSettings({});
          orders = [];
          selectedId = products[0]?.id || null;
          render();
        } catch {
          app.innerHTML = `<div class="panel empty"><h2>Không tải được API</h2><p>${esc(error.message)}</p><p>Kiểm tra đã upload đủ file trong thư mục <strong>api</strong> và có thư mục <strong>data</strong>, <strong>uploads</strong> trên host chưa.</p></div>`;
        }
      }
    }

    function normalizeSettings(value) {
      const rawCategoryImages = value.categoryImages && typeof value.categoryImages === 'object' && !Array.isArray(value.categoryImages) ? value.categoryImages : {};
      const categoryImages = {};
      Object.entries(rawCategoryImages).forEach(([catId, src]) => {
        if (src) categoryImages[normalizeCategoryId(catId)] = src;
      });
      return {
        featuredIds: Array.isArray(value.featuredIds) ? value.featuredIds.map(String) : [],
        headerImages: Array.isArray(value.headerImages) ? value.headerImages.filter(Boolean) : [],
        categoryImages
      };
    }

    function render() {
      const product = selectedProduct();
      app.innerHTML = `
        <div class="topbar">
          <div>
            <h1>Quản lý website</h1>
            <div class="sub">Sản phẩm, phân loại, ảnh, bán chạy, header, danh mục và đơn hàng.</div>
            <div id="productDraftStatus" class="sub" role="status" aria-live="polite" style="font-weight:900">${pendingUploads ? `Đang tải ${pendingUploads} ảnh; hãy chờ tải xong rồi mới lưu.` : productDraftDirty ? productDraftStorageFailed ? 'Có thay đổi chưa lưu; trình duyệt không giữ được bản nháp tự động. Hãy lưu trước khi rời trang.' : 'Có thay đổi sản phẩm chưa lưu. Bản nháp đang được giữ trên trình duyệt này.' : ''}</div>
            ${!apiOnline ? '<div class="sub" style="color:#d98221;font-weight:900">Đang ở chế độ preview local: xem được dữ liệu nhưng không lưu/upload trực tiếp. Lên host có PHP thì sẽ lưu được.</div>' : ''}
          </div>
          <div class="actions">
            <button onclick="saveAll()" ${saving || !apiOnline || pendingUploads ? 'disabled' : ''}>${apiOnline ? 'Lưu local' : 'Preview local'}</button>
            <button class="secondary" onclick="previewWebsite()">Preview</button>
            <button class="secondary" onclick="pushGit()" ${saving || !apiOnline || pendingUploads ? 'disabled' : ''}>Push Git</button>
          </div>
        </div>

        <div class="tabs">
          ${[
            ['products', 'Sản phẩm'],
            ['featured', 'Bán chạy'],
            ['header', 'Ảnh header'],
            ['categories', 'Ảnh danh mục'],
            ['blog', 'Bài viết'],
            ['orders', 'Đơn hàng']
          ].map(([key, label]) => `<button class="${activeTab === key ? 'tab active' : 'tab'}" onclick="activeTab='${key}'; render()">${label}</button>`).join('')}
        </div>

        ${activeTab === 'products' ? `
        <div class="grid">
          <aside class="panel side">
            <div class="actions" style="margin-bottom:12px">
              <button onclick="addProduct()">+ Thêm sản phẩm</button>
            </div>
            <div class="product-list-toolbar">
              <input id="search" placeholder="Tìm theo tên hoặc SKU..." aria-label="Tìm sản phẩm theo tên hoặc SKU" value="${esc(listSearch)}" oninput="listSearch = this.value; renderProductList()" />
              <select id="visibilityFilter" aria-label="Lọc trạng thái sản phẩm" onchange="listVisibility = this.value; renderProductList()">
                <option value="all" ${listVisibility === 'all' ? 'selected' : ''}>Tất cả</option>
                <option value="visible" ${listVisibility === 'visible' ? 'selected' : ''}>Đang hiển thị</option>
                <option value="hidden" ${listVisibility === 'hidden' ? 'selected' : ''}>Đang ẩn</option>
              </select>
            </div>
            <select id="catFilter" aria-label="Lọc danh mục" onchange="listCategory = this.value; renderProductList()">
              <option value="">Tất cả danh mục</option>
              ${CATEGORIES.map(([value, label]) => `<option value="${value}" ${listCategory === value ? 'selected' : ''}>${label}</option>`).join('')}
            </select>
            <div id="productList" style="margin-top:12px"></div>
          </aside>

          <main class="panel editor">
            ${product ? editorHtml(product) : '<div class="empty">Chưa có sản phẩm. Bấm “+ Thêm sản phẩm” để tạo mới.</div>'}
          </main>
        </div>
        ` : `<main class="panel editor">${adminTabHtml()}</main>`}
        ${featuredPickerIndex !== null ? featuredPickerHtml() : ''}
      `;
      if (activeTab === 'products') renderProductList();
      app.inert = saving;
      app.setAttribute('aria-busy', String(saving));
    }

    function renderKeepScroll() {
      const scrollingElement = document.scrollingElement || document.documentElement;
      const scrollTop = scrollingElement.scrollTop;
      const scrollLeft = scrollingElement.scrollLeft;
      render();
      requestAnimationFrame(() => scrollingElement.scrollTo(scrollLeft, scrollTop));
    }

    function renderProductList() {
      const list = document.getElementById('productList');
      if (!list) return;
      const q = normalizeText(listSearch);
      const cat = listCategory;
      const filtered = products.filter(product => {
        const matchesText = !q || normalizeText([product.name, product.sku, product.categoryId].join(' ')).includes(q);
        const matchesCat = !cat || product.categoryId === cat;
        const matchesVisibility = listVisibility === 'all' || (listVisibility === 'hidden' ? isHidden(product) : !isHidden(product));
        return matchesText && matchesCat && matchesVisibility;
      });
      list.innerHTML = `<div class="product-list-count">${filtered.length} / ${products.length} sản phẩm</div>` + (filtered.map(product => {
        const img = firstImage(product);
        const hidden = isHidden(product);
        return `
          <div class="product-item ${String(product.id) === String(selectedId) ? 'active' : ''} ${hidden ? 'is-hidden' : ''}" onclick="selectProduct('${esc(product.id)}')">
            ${img ? `<img class="thumb" src="${esc(img)}" />` : `<div class="thumb">Ảnh</div>`}
            <div>
              <div class="name">${esc(product.name || 'Chưa đặt tên')}${hidden ? '<span class="hidden-badge">Ẩn</span>' : ''}</div>
              <div class="price">${fmt(product.price)}</div>
              <div class="muted">${esc(product.sku || '')} · ${(product.variants || []).length} phân loại</div>
            </div>
          </div>
      `;
      }).join('') || '<div class="empty">Không có sản phẩm phù hợp. Thử từ khóa hoặc bộ lọc khác.</div>');
    }

    function adminTabHtml() {
      if (activeTab === 'featured') return featuredHtml();
      if (activeTab === 'header') return headerHtml();
      if (activeTab === 'categories') return categoryImagesHtml();
      if (activeTab === 'blog') return blogHtml();
      if (activeTab === 'orders') return ordersHtml();
      return '';
    }

    function featuredHtml() {
      const ids = settings.featuredIds || [];
      const slotCount = Math.max(7, ids.length + 1);
      return `
        <h2>Sản phẩm bán chạy</h2>
        <p class="muted">Bấm vào từng ô để chọn sản phẩm bằng hình ảnh. Vị trí 1 hiện đầu tiên ngoài trang chủ, vị trí 5 hiện ô thứ 5.</p>
        <div class="featured-slots">
          ${Array.from({ length: slotCount }).map((_, index) => {
            const selectedId = ids[index] || '';
            const selectedProduct = products.find(product => String(product.id) === String(selectedId));
            const img = selectedProduct ? firstImage(selectedProduct) : '';
            return `
              <div class="featured-slot ${selectedProduct ? 'active' : ''}" onclick="openFeaturedPicker(${index})">
                <div class="featured-slot-img">
                  ${img ? `<img src="${esc(img)}" />` : '<span>+<br>Chọn sản phẩm</span>'}
                </div>
                <div class="slot-no">Vị trí ${index + 1}</div>
                <div class="slot-name">${selectedProduct ? esc(selectedProduct.name) : 'Chưa chọn'}</div>
                ${selectedProduct ? `<div class="picker-price">${fmt(selectedProduct.price)}</div>` : '<div class="muted" style="font-size:12px;margin-top:5px">Bấm để chọn</div>'}
                <div class="slot-actions">
                  <button class="secondary" onclick="event.stopPropagation(); moveFeatured(${index}, -1)" ${index === 0 ? 'disabled' : ''}>Lên</button>
                  <button class="secondary" onclick="event.stopPropagation(); moveFeatured(${index}, 1)" ${index >= ids.length - 1 ? 'disabled' : ''}>Xuống</button>
                  <button class="danger" onclick="event.stopPropagation(); removeFeaturedSlot(${index})" ${!selectedProduct ? 'disabled' : ''}>Xoá</button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function featuredPickerHtml() {
      const selectedId = String((settings.featuredIds || [])[featuredPickerIndex] || '');
      const q = normalizeText(featuredPickerSearch);
      const filtered = products.filter(product => {
        if (!q) return true;
        return normalizeText([product.name, product.sku, product.categoryId].join(' ')).includes(q);
      });
      return `
        <div class="picker-backdrop" onclick="closeFeaturedPicker()">
          <div class="picker-modal" onclick="event.stopPropagation()">
            <div class="picker-head">
              <div>
                <h2 style="margin:0">Chọn sản phẩm cho vị trí ${featuredPickerIndex + 1}</h2>
                <p class="muted" style="margin:4px 0 0">Bấm vào sản phẩm có ảnh để đưa lên khu bán chạy.</p>
              </div>
              <button class="secondary" onclick="closeFeaturedPicker()">Đóng</button>
            </div>
            <input placeholder="Tìm sản phẩm theo tên, SKU hoặc danh mục..." value="${esc(featuredPickerSearch)}" oninput="featuredPickerSearch=this.value; render()" />
            <div class="picker-grid">
              <div class="picker-card ${!selectedId ? 'selected' : ''}" onclick="setFeaturedSlot(${featuredPickerIndex}, ''); closeFeaturedPicker()">
                <div class="picker-img">Trống</div>
                <div class="picker-title">Không chọn sản phẩm ở vị trí này</div>
                <div class="muted" style="font-size:12px;margin-top:5px">Ô này sẽ không hiện ngoài trang chủ.</div>
              </div>
              ${filtered.map(product => {

    function headerHtml() {

        <h2>Ảnh header</h2>

    function categoryImagesHtml() {

                  ${src ? `<img src="${esc(src)}" /><button class="remove-img" onclick="event.stopPropagation(); removeCategoryImage('${catId}')">Xoá</button>` : `<span>+<br>${esc(label)}</span>`}

              </div>

    function blogHtml() {
      const BLOG_CATEGORIES = [
        ['huong-dan-xong', 'Hướng dẫn'],
        ['kien-thuc', 'Kiến thức'],
      ];
      const fileName = blogZipFile ? blogZipFile.name : '';
      const slugPreview = blogSlug || (fileName ? slugifyVi(fileName.replace(/\.html?$/i, '')) : '');
      const missingImages = missingBlogPromptImages();
      return `
        <h2>Bài viết blog</h2>
        <p class="muted">Upload 1 file HTML chuẩn SEO. Nếu bài có các khối <code>image-prompt</code>, admin sẽ tạo ô thêm ảnh tương ứng, ghép ảnh vào đúng vị trí prompt, xoá prompt nội bộ, chuẩn hoá canonical/meta/schema và cập nhật sitemap.</p>

        <div style="background:#f7fbf5;border:2px dashed #b2d9a8;border-radius:18px;padding:28px 24px;margin-bottom:22px">
          <h3 style="margin:0 0 18px;font-size:17px">Đăng bài viết mới</h3>

          <label>Chọn file HTML bài viết</label>
          <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
            <label style="
              display:inline-flex;align-items:center;gap:8px;
              background:#318223;color:#fff;font-weight:900;font-size:14px;
              padding:10px 18px;border-radius:12px;cursor:pointer;margin:0
            ">
              📄 Chọn file .html
              <input type="file" accept=".html,.htm,text/html" style="display:none" onchange="
                handleBlogHtmlChange(this.files[0]);
                this.value = '';
              " />
            </label>
            ${blogZipFile
              ? `<span style="color:#318223;font-weight:700">✓ ${esc(blogZipFile.name)}</span><button class="danger small" onclick="clearBlogHtml()">✕</button>`
              : `<span class="muted" style="font-size:13px">Chưa chọn file</span>`
            }
          </div>

          ${blogZipFile ? blogImagePreviewHtml() : ''}
          ${blogSeoHtml()}

          <div class="row" style="margin-top:14px">
            <div>
              <label>Danh mục URL</label>
              <select onchange="blogCategory=this.value;render()">
                ${BLOG_CATEGORIES.map(([val, label]) => `<option value="${val}" ${blogCategory===val?'selected':''}>${label} (/${val}/)</option>`).join('')}
              </select>
            </div>
            <div>
              <label>Slug bài viết <span class="muted">(có thể để tự lấy từ file HTML/canonical)</span></label>
              <input value="${esc(blogSlug)}" placeholder="vd: den-xong-tinh-dau-bang-nen-cach-dung-dung" oninput="blogSlug=this.value" />
            </div>
          </div>

          ${blogSlug || slugPreview ? `
            <p class="muted" style="margin:10px 0 0;font-size:13px">
              📌 Sẽ lưu tại: <strong>blog/${esc(blogCategory)}/${esc(slugPreview || blogSlug)}/index.html</strong>
              → URL: <code>https://phuonglam.com/blog/${esc(blogCategory)}/${esc(slugPreview || blogSlug)}/</code>
            </p>
          ` : ''}

          <div style="margin-top:18px">
            <button onclick="saveBlogPost()" ${blogSaving || blogPreviewLoading || !apiOnline || !blogZipFile || missingImages ? 'disabled' : ''}>
              ${blogSaving ? 'Đang lưu...' : '💾 Lưu local bài viết'}
            </button>
            <button class="secondary" onclick="previewBlogPost()" ${blogPreviewLoading || !apiOnline || !blogZipFile || missingImages ? 'disabled' : ''}>Preview bài hoàn chỉnh</button>
            ${!apiOnline ? '<span class="muted" style="font-size:13px;margin-left:10px">Chỉ lưu được khi chạy admin local bằng node</span>' : ''}
            ${missingImages ? '<span class="muted" style="font-size:13px;margin-left:10px;color:#b45f00;font-weight:800">Cần thêm đủ ảnh cho các prompt trước khi preview/lưu.</span>' : ''}
          </div>
        </div>

        <h3 style="margin:0 0 12px">Bài viết hiện có (${blogPosts.length})</h3>
        ${blogPosts.length === 0
          ? '<p class="muted">Chưa có bài viết nào.</p>'
          : `<div style="display:flex;flex-direction:column;gap:10px">
            ${blogPosts.map(post => {
              const viewUrl = publicSiteUrl(post.url || `/blog/${post.category}/${post.slug}/`);
              return `
              <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f9fbf7;border:1px solid #dde8d8;border-radius:14px;padding:14px 18px;flex-wrap:wrap">
                <div>
                  <div style="font-weight:700;color:#1f3a1a">${esc(post.title || post.slug)}</div>
                  <div class="muted" style="font-size:12px;margin-top:2px">${esc(post.categoryLabel || post.category)} / ${esc(post.slug)}</div>
                  <div class="muted" style="font-size:13px;margin-top:2px">
                    <a href="${esc(viewUrl)}" target="_blank" rel="noopener" style="color:#318223">Xem bài viết ↗</a>
                  </div>
                </div>
                <div style="display:flex;gap:8px">
                  <button class="secondary small" onclick="window.open(${jsAttr(viewUrl)},'_blank','noopener')">Xem</button>
                  <button class="danger small" onclick="deleteBlogPost('${esc(post.category)}','${esc(post.slug)}')">Xoá</button>
                </div>
              </div>
            `}).join('')}
          </div>`
        }
      `;
    }

    function blogImagePreviewHtml() {
      return `
        <div style="margin-top:18px">
          <label>Ảnh theo prompt trong bài viết <span class="muted">(upload đúng ảnh vào từng vị trí prompt)</span></label>
          ${blogPreviewLoading ? '<p class="muted" style="margin:8px 0 0">Đang đọc prompt ảnh trong HTML...</p>' : ''}
          ${blogPreviewError ? `<p style="margin:8px 0 0;color:#b45f00;font-weight:800">${esc(blogPreviewError)}</p>` : ''}
          ${!blogPreviewLoading && blogPreviewImages.length === 0
            ? '<p class="muted" style="margin:8px 0 0">Chưa tìm thấy khối <code>image-prompt</code>. Bài vẫn lưu được nếu HTML đã có ảnh hoàn chỉnh.</p>'
            : ''}
          <div class="blog-image-grid">
            ${blogPreviewImages.map((_, index) => blogImageSlotHtml(index)).join('')}
          </div>
        </div>
      `;
    }

    function blogImageSlotHtml(index) {
      const image = blogPreviewImages[index] || null;
      const replacementPreview = blogImageReplacementPreviews[index] || '';
      const preview = replacementPreview || '';
      const label = blogImageReplacements[index]?.name || image?.label || `Prompt ảnh ${index + 1}`;
      const promptText = image?.prompt || '';
      const altText = image?.alt || '';
      const fileHint = image?.filename || '';
      const canReplace = Boolean(image);
      return `
        <div class="blog-image-card">
          <div class="image-box" ${canReplace ? `onclick="pickBlogImageReplacement(${index})" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="dropBlogImageReplacement(event, ${index})"` : ''}>
            ${preview ? `<img src="${esc(preview)}" />` : `<span>+<br>Thêm ảnh ${index + 1}</span>`}
          </div>
          <div class="blog-image-name">
            ${esc(label)}
            ${replacementPreview ? '<br><span class="muted">Đã chọn ảnh cho prompt này</span>' : '<br><span class="muted">Chưa chọn ảnh</span>'}
            ${altText ? `<br><span class="muted">Alt: ${esc(altText)}</span>` : ''}
            ${fileHint ? `<br><span class="muted">Tên file gợi ý: ${esc(fileHint)}</span>` : ''}
          </div>
          ${promptText ? `<div class="blog-prompt-text">${esc(promptText)}</div>` : ''}
          <div class="blog-image-actions">
            <button class="secondary small" onclick="pickBlogImageReplacement(${index})" ${canReplace ? '' : 'disabled'}>${replacementPreview ? 'Đổi ảnh' : 'Thêm ảnh'}</button>
            ${replacementPreview ? `<button class="danger small" onclick="clearBlogImageReplacement(${index})">Bỏ ảnh</button>` : ''}
          </div>
        </div>
      `;
    }

    function blogSeoHtml() {
      if (!blogZipFile || blogSeoChecks.length === 0) return '';
      return `
        <div style="margin-top:18px">
          <label>Kiểm tra SEO trước khi lưu</label>
          <div class="blog-seo-checks">
            ${blogSeoChecks.map(check => `
              <div class="blog-seo-check ${esc(check.level || 'warn')}">
                <span class="blog-seo-dot"></span>
                <div>
                  <strong>${esc(check.label || '')}</strong>
                  <div class="muted">${esc(check.message || '')}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function missingBlogPromptImages() {
      return blogPreviewImages.some((_, index) => !blogImageReplacements[index]);
    }

    function slugifyVi(text) {
      return String(text)
        .normalize('NFD').replace(/[̀-ͯ]/g, '')
        .replace(/đ/gi, 'd')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    function clearBlogHtml() {
      blogZipFile = null;
      blogSlug = '';
      blogPreviewImages = [];
      blogImageReplacements = [];
      blogImageReplacementPreviews = [];
      blogPreviewLoading = false;
      blogPreviewError = '';
      blogSeoChecks = [];
      render();
    }

    function handleBlogHtmlChange(file) {
      blogZipFile = file || null;
      blogPreviewImages = [];
      blogImageReplacements = [];
      blogImageReplacementPreviews = [];
      blogPreviewError = '';
      blogSeoChecks = [];
      if (blogZipFile && !blogSlug) {
        blogSlug = slugifyVi(blogZipFile.name.replace(/\.html?$/i,''));
      }
      render();
      if (blogZipFile && apiOnline) loadBlogHtmlPreview();
    }

    async function loadBlogHtmlPreview() {
      if (!blogZipFile) return;
      blogPreviewLoading = true;
      render();
      try {
        const form = new FormData();
        if (blogCategory) form.append('category', blogCategory);
        if (blogSlug) form.append('slug', blogSlug);
        form.append('html', blogZipFile, blogZipFile.name);
        const res = await fetch(API_BLOG_PREVIEW, { method: 'POST', body: form });
        const data = await readJsonResponse(res, 'API đọc HTML bài viết');
        if (!data.ok) throw new Error(data.message || 'Không đọc được prompt trong HTML');
        blogPreviewImages = Array.isArray(data.prompts) ? data.prompts : [];
        blogImageReplacements = Array.from({ length: blogPreviewImages.length });
        blogImageReplacementPreviews = Array.from({ length: blogPreviewImages.length });
        blogSeoChecks = Array.isArray(data.seo) ? data.seo : [];
        if (!blogSlug && data.slug) blogSlug = data.slug;
        blogPreviewError = '';
      } catch (error) {
        blogPreviewImages = [];
        blogSeoChecks = [];
        blogPreviewError = error.message.includes('không đúng định dạng JSON') || error.message.includes('404')
          ? 'Server admin đang chạy bản cũ. Hãy tắt/mở lại admin local để dùng chức năng upload HTML + prompt ảnh.'
          : `Không đọc được HTML: ${error.message}`;
      } finally {
        blogPreviewLoading = false;
        render();
      }
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result || '');
        reader.onerror = () => reject(reader.error || new Error('Không đọc được file ảnh'));
        reader.readAsDataURL(file);
      });
    }

    async function setBlogImageReplacement(index, file) {
      if (!file || !file.type?.startsWith('image/')) {
        alert('Hãy chọn đúng file ảnh.');
        return;
      }
      blogImageReplacements[index] = file;
      blogImageReplacementPreviews[index] = await readFileAsDataUrl(file);
      render();
    }

    function pickBlogImageReplacement(index) {
      if (!blogPreviewImages[index]) return;
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = () => setBlogImageReplacement(index, input.files[0]);
      input.click();
    }

    async function dropBlogImageReplacement(event, index) {
      const file = getDroppedImage(event);
      if (!file || !blogPreviewImages[index]) return;
      await setBlogImageReplacement(index, file);
    }

    function clearBlogImageReplacement(index) {
      blogImageReplacements[index] = null;
      blogImageReplacementPreviews[index] = '';
      render();
    }

    async function loadBlogPosts() {
      try {
        const res = await fetch(API_BLOG, { cache: 'no-store' });
        const data = await readJsonResponse(res, 'API Blog');
        if (data.ok) setBlogPosts(data.posts || []);
      } catch { setBlogPosts([]); }
    }

    function buildBlogForm({ renderPreview = false } = {}) {
      const slug = blogSlug || slugifyVi((blogZipFile?.name || '').replace(/\.html?$/i, ''));
      const form = new FormData();
      form.append('category', blogCategory);
      if (slug) form.append('slug', slug);
      if (renderPreview) form.append('render', '1');
      form.append('html', blogZipFile, blogZipFile.name);
      blogImageReplacements.forEach((file, index) => {
        if (file && blogPreviewImages[index]) form.append(`blogImage${index}`, file, file.name);
      });
      return { form, slug };
    }

    async function previewBlogPost() {
      if (!blogZipFile) return;
      if (missingBlogPromptImages()) {
        alert('Hãy thêm đủ ảnh cho các prompt trước khi preview.');
        return;
      }
      const previewWindow = window.open('', '_blank');
      if (previewWindow) {
        previewWindow.document.write('<p style="font-family:sans-serif;padding:24px">Đang dựng preview bài viết...</p>');
      }
      try {
        const { form } = buildBlogForm({ renderPreview: true });
        const res = await fetch(API_BLOG_PREVIEW, { method: 'POST', body: form });
        const data = await readJsonResponse(res, 'API preview bài viết');
        if (!data.ok) throw new Error(data.message || 'Không tạo được preview bài viết');
        blogSeoChecks = Array.isArray(data.seo) ? data.seo : blogSeoChecks;
        if (previewWindow) {
          previewWindow.document.open();
          previewWindow.document.write(data.previewHtml || '');
          previewWindow.document.close();
        } else {
          alert('Trình duyệt đang chặn popup preview. Hãy cho phép popup rồi bấm lại.');
        }
      } catch (error) {
        if (previewWindow) previewWindow.close();
        alert('Lỗi preview: ' + error.message);
      } finally {
        render();
      }
    }

    async function saveBlogPost() {
      if (!blogZipFile) return;
      if (missingBlogPromptImages()) {
        alert('Hãy thêm đủ ảnh cho các prompt trước khi lưu.');
        return;
      }
      blogSaving = true;
      render();
      try {
        const { form } = buildBlogForm();
        const res = await fetch(API_BLOG, { method: 'POST', body: form });
        const data = await readJsonResponse(res, 'API Blog');
        if (!data.ok) throw new Error(data.message || 'Lưu bài viết thất bại');
        setBlogPosts(data.posts || blogPosts);
        blogZipFile = null;
        blogSlug = '';
        blogPreviewImages = [];
        blogImageReplacements = [];
        blogImageReplacementPreviews = [];
        blogPreviewError = '';
        blogSeoChecks = [];
        alert(`✅ Đã lưu local! Bài viết tại: ${publicSiteUrl(data.url)}\nSitemap và danh sách blog đã cập nhật. Bấm Preview để kiểm tra, ổn rồi bấm Push Git.`);
      } catch (error) {
        alert('Lỗi: ' + error.message);
      } finally {
        blogSaving = false;
        render();
      }
    }

    async function deleteBlogPost(category, slug) {
      if (!confirm(`Xoá bài viết blog/${category}/${slug}/ ?\nThao tác này không khôi phục được.`)) return;
      try {
        const res = await fetch(API_BLOG, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ category, slug })
        });
        const data = await readJsonResponse(res, 'API Blog');
        if (!data.ok) throw new Error(data.message || 'Xoá thất bại');
        setBlogPosts(data.posts || blogPosts);
        render();
      } catch (error) {
        alert('Lỗi: ' + error.message);
      }
    }

    function ordersHtml() {
      return `
        <h2>Đơn hàng</h2>
        <p class="muted">Đơn mới từ website sẽ hiện ở đây. Có thể đổi trạng thái để theo dõi xử lý.</p>
        <div style="overflow:auto">

                        ['Processing', 'Đang xử lý'],
                        ['Done', 'Hoàn tất'],
                        ['Cancelled', 'Đã huỷ']
                      ].map(([value, label]) => `<option value="${value}" ${order.status === value ? 'selected' : ''}>${label}</option>`).join('')}
                    </select>

              `).join('') || `<tr><td colspan="6" class="empty">Chưa có đơn hàng.</td></tr>`}

            <h2>${esc(product.name || 'Sản phẩm mới')}</h2>
